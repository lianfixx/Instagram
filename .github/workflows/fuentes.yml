name: Vigilar las fuentes de Instagram

# El día 1 de cada mes comprueba que las citas de las fuentes oficiales que se pueden leer
# sin JavaScript sigan en línea (skills/instagram-studio/data/fuentes.json, auto=true).
# Si alguna cambió o no responde, el trabajo falla y GitHub avisa. No modifica nada por sí solo:
# la revisión completa (Centro de ayuda, tarjetas de Meta, Mosseri) se hace a mano o con la tarea mensual.
on:
  schedule:
    - cron: "23 16 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Comprobar las citas de las fuentes
        run: python3 skills/instagram-studio/scripts/igstudio.py fuentes comprobar
